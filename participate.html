<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Participate — Good for Nothing</title>
    <style>
:root{
  --x:50%;
  --y:45%;
  --ink:#f4f1e8;
  --muted:rgba(244,241,232,.62)
}
  .cosmos{
    position:fixed;
    inset:0;
    z-index:-2;
    overflow:hidden;
    background:radial-gradient(circle at var(--x) var(--y),rgba(105,93,154,.20),rgba(49,64,109,.09) 20%,transparent 46%),radial-gradient(circle at 84% 18%,rgba(169,122,93,.07),transparent 28%),linear-gradient(160deg,#090b12,#05060a 48%,#080810)}
 .star{
   position:absolute;
   border-radius:50%;
   background:white;
   pointer-events:none;
}
 .im-here {
   position: absolute;
   background: none;
   border: none;
   color: var(--muted);
   font: inherit;
   cursor: pointer;
   transition: color 1.5s ease;
   transform: translate(8px, -50%);
}
.im-here:hover {
  color: var(--ink);
}
 body {
  margin: 0;
  background: #05060a;
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
}
  </style>
</head>
<body>
  <div class="cosmos" aria-hidden="true"></div>
<button class="im-here">
  I'm here
</button>
  <script>
 const cosmos = document.querySelector(".cosmos");
 const imHere = document.querySelector(".im-here");
 const star = document.createElement("span");
 star.className = "star";
      const size = Math.random() * 3 + 2;
  star.style.width=size+"px";
  star.style.height=size+"px";
 const starX = Math.random() * 100;
 const starY = Math.random() * 100;
  star.style.left = starX + "%";
  star.style.top = starY + "%";
    imHere.style.left = starX + "%";
    imHere.style.top = starY + "%";
  star.style.opacity=Math.random()*.65+.15;
  cosmos.appendChild(star);
const root = document.documentElement;
let tx = 50;
let ty = 45;
let x = 50;
let y = 45;
addEventListener("pointermove", e => {
  tx = e.clientX / innerWidth * 100;
  ty = e.clientY / innerHeight * 100;
});
function breathe() {
  x += (tx - x) * .025;
  y += (ty - y) * .025;
  root.style.setProperty("--x", x + "%");
  root.style.setProperty("--y", y + "%");
  requestAnimationFrame(breathe);
}
breathe();
  </script>
</body>
</html>
