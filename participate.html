<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Participate — Good for Nothing</title>
    <style>
:root{
  --x:50%;
  --y:45%;
  --ink:#f4f1e8;
  --muted:rgba(244,241,232,.62)
}
  .cosmos{
    position:fixed;
    inset:0;
    z-index:-2;
    overflow:hidden;
    background:radial-gradient(circle at var(--x) var(--y),rgba(105,93,154,.20),rgba(49,64,109,.09) 20%,transparent 46%),radial-gradient(circle at 84% 18%,rgba(169,122,93,.07),transparent 28%),linear-gradient(160deg,#090b12,#05060a 48%,#080810)}
 .star{
   position:absolute;
   border-radius:50%;
   background:white;
   pointer-events:none;
}
 body {
  margin-left: 48px;
    margin-top: 48px;
  background: #05060a;
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
}
  h1 {
    margin: 0;
}
  p {
   color: var(--muted);
    margin-left: 0px;
    margin-top: 16px;
}
  </style>
</head>
<body>
  <div class="cosmos" aria-hidden="true"></div>
  <h1>Participate</h1>
  <p>Please be patient with us while we await ignition.</p>
  <script>
 const cosmos = document.querySelector(".cosmos");
 const star = document.createElement("span");
 star.className = "star";
      const size = Math.random() * 3 + 2;
  star.style.width=size+"px";
  star.style.height=size+"px";
  star.style.left=Math.random()*100+"%";
  star.style.top=Math.random()*100+"%";
  star.style.opacity=Math.random()*.65+.15;
  cosmos.appendChild(star);
const root = document.documentElement;
let tx = 50;
let ty = 45;
let x = 50;
let y = 45;
addEventListener("pointermove", e => {
  tx = e.clientX / innerWidth * 100;
  ty = e.clientY / innerHeight * 100;
});
function breathe() {
  x += (tx - x) * .025;
  y += (ty - y) * .025;
  root.style.setProperty("--x", x + "%");
  root.style.setProperty("--y", y + "%");
  requestAnimationFrame(breathe);
}
breathe();
  </script>
</body>
</html>
