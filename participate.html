<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Participate — Good for Nothing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&family=Source+Sans+3:wght@400;500&display=swap" rel="stylesheet">
    <style>
:root{
  --x:50%;
  --y:45%;
  --ink:#f4f1e8;
  --muted:rgba(244,241,232,.62);
  --radius:12px;
  --font-display: "EB Garamond", serif;
  --font-body: "Source Sans 3", sans-serif;
  --font-ui: "Inter", sans-serif;
   --font-correspondence: "IBM Plex Mono", monospace;
}

* {
  box-sizing: border-box;
}
  .cosmos{
    position:fixed;
    inset:0;
    z-index:-2;
    overflow:hidden;
    background:radial-gradient(circle at var(--x) var(--y),rgba(105,93,154,.20),rgba(49,64,109,.09) 20%,transparent 46%),radial-gradient(circle at 84% 18%,rgba(169,122,93,.07),transparent 28%),linear-gradient(160deg,#090b12,#05060a 48%,#080810)}
 .star{
   position:absolute;
   border-radius:50%;
   background:white;
   pointer-events:none;
}
      .orientation-mark {
  position: fixed;
  top: 24px;
  right: 24px;
  z-index: 10;

  width: 52px;
  height: 52px;
  padding: 9px;

  border: 1px solid rgba(244, 241, 232, .24);
  border-radius: 50%;

  background: rgba(5, 6, 10, .76);
  backdrop-filter: blur(12px);

  cursor: pointer;
}

.orientation-mark img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}
 .im-here {
   position: absolute;
   background: none;
   border: none;
   color: var(--muted);
   font-family: var(--font-ui);
   cursor: pointer;
   transition: color 1.5s ease;
   transform: translate(8px, -50%);
}
.im-here:hover {
  color: var(--ink);
}
      .letter h2 {
  font-family: var(--font-display);
  font-size: clamp(2.8rem, 5vw, 4rem);
  font-weight: 400;
  line-height: 1;
  letter-spacing: -.04em;
  margin: 0 0 36px;
}
 .letter {
   width: min(560px, calc(100% - 48px));
   margin: 0;
   padding: 40px;
   background: var(--ink);
   color: #05060a;
   border-radius: var(--radius);
   line-height: 1.5;
   opacity: 0;
   visibility: hidden;
   transition: opacity 1.5s ease;
   font-family:var(--font-correspondence);
}
.letter.open {
   opacity: 1;
   visibility: visible;
}
.out-of-reach {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  width: 100%;
  margin: 0;
  text-align: center;
  color: var(--muted);
  opacity: 0;
  transition: opacity 3s ease;
}
 body {
  margin: 0;
  background: #05060a;
  color: var(--ink);
  font-family: var(--font-body);
}
      .participation-space {
  display: none;

  width: min(1200px, calc(100% - 48px));
  margin: 100px auto;

  position: relative;
}
      /* Arrange our fragments when the space opens */
.participation-space.open {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 32px;
  align-items: start;
}

/* The welcome letter occupies the left side */
.participation-space .letter {
  grid-column: 1 / span 6;
  width: 100%;
}

/* Contact us occupies a smaller area on the right */
.contact-block {
  grid-column: 8 / span 4;
  margin-top: 90px;

  padding: 30px;
  color: #25221f;
  border-radius: var(--radius);
}

/* Small archival label */
.block-label {
  font-family: var(--font-correspondence);
  font-size: .75rem;
  letter-spacing: .12em;
  color: #746c60;
}

.contact-block h2 {
  margin: 30px 0 12px;
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 400;
}

.contact-block p {
  line-height: 1.5;
}

.block-toggle {
  margin-top: 16px;
  padding: 0;
  border: none;
  background: transparent;
  color: #25221f;
  font-family: var(--font-correspondence);
  cursor: pointer;
}

/* An expanded block gets more room */
      .service {
  border-top: 1px solid rgba(37, 34, 31, .2);
  padding: 15px 0;
}

.service summary {
  cursor: pointer;
  font-family: var(--font-body);
  font-size: 1.05rem;
  font-weight: 500;
  color: #25221f;
}

.service summary:hover {
  color: #4f8f8a;
}

.service p {
  margin: 16px 0 4px;
  line-height: 1.6;
}

.contact-invitation {
  margin-top: 30px;
  padding-top: 20px;
  border-top: 1px solid rgba(37, 34, 31, .2);
}

.contact-email {
  display: inline-block;
  max-width: 100%;
  overflow-wrap: anywhere;
  color: #345e59;
  font-family: var(--font-correspondence);
  font-size: .85rem;
  text-decoration-thickness: 1px;
  text-underline-offset: 5px;
}

/* On narrow screens, stack the fragments */
@media (max-width: 700px) {
  .participation-space.open {
    grid-template-columns: 1fr;
    gap: 28px;
  }

  .participation-space .letter,
  .contact-block,
  .contact-block.expanded {
    grid-column: 1;
    width: 100%;
  }

  .contact-block {
    margin-top: 0;
  }
}
      .contact-block {
  position: relative;
  isolation: isolate;
  background: #eee8dc;
  border: 1px solid rgba(37, 34, 31, .22);
}

.contact-block::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;

  background-image:
    repeating-linear-gradient(
      0deg,
      rgba(91, 68, 47, .035) 0px,
      rgba(91, 68, 47, .035) 1px,
      transparent 1px,
      transparent 4px
    ),
    repeating-linear-gradient(
      90deg,
      rgba(91, 68, 47, .025) 0px,
      rgba(91, 68, 47, .025) 1px,
      transparent 1px,
      transparent 6px
    );
}
      .contact-block {
  cursor: pointer;
  transition: width .5s ease, transform .5s ease;
}

.contact-block.expanded {
  width: calc(150% + 32px);
  z-index: 5;
  cursor: default;
}

.contact-close {
  position: absolute;
  top: 18px;
  right: 20px;
  border: none;
  background: transparent;
  color: #25221f;
  font-family: var(--font-ui);
  font-size: 1.6rem;
  cursor: pointer;
}

.contact-close[hidden] {
  display: none;
}

@media (max-width: 700px) {
  .contact-block.expanded {
    grid-column: 1;
    width: 100%;
  }
}
      .welcome-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin: 30px 0;
}

.welcome-form label {
  font-size: .78rem;
  margin-top: 8px;
}

.welcome-form input {
  width: 100%;
  padding: 13px;
  border: 1px solid rgba(37, 34, 31, .3);
  border-radius: 4px;
  background: #eee8dc;
  color: #25221f;
  font: inherit;
}

.welcome-form input:disabled {
  opacity: .7;
}

.welcome-form button {
  margin-top: 12px;
  padding: 14px;
  border: 1px solid #25221f;
  background: #25221f;
  color: #f4f1e8;
  font-family: var(--font-ui);
  cursor: not-allowed;
  opacity: .55;
}

.welcome-form-status {
  font-size: .75rem;
  color: #746c60;
}
      .participation-space .letter {
  position: relative;
  cursor: pointer;
  transition: opacity 1.5s ease, width .5s ease;
}

.participation-space .letter.expanded {
  width: 135%;
  z-index: 6;
  cursor: default;
}

.letter-close {
  position: absolute;
  top: 18px;
  right: 20px;
  border: none;
  background: transparent;
  color: #25221f;
  font-family: var(--font-ui);
  font-size: 1.6rem;
  cursor: pointer;
}

.letter-close[hidden] {
  display: none;
}

@media (max-width: 700px) {
  .participation-space .letter.expanded {
    grid-column: 1;
    width: 100%;
  }
}
      @media (max-width: 700px) {
  .contact-block.expanded,
  .participation-space .letter.expanded {
    width: 100%;
  }
}
          /* Migration: scrapbook slots control arrangement */
.participation-space:not(.open) {
  display: none;
}
.participation-space.open > .scrapbook-slot {
  grid-column: var(--artifact-column, auto);
  margin-top: var(--artifact-offset-y, 0px);
  min-width: 0;
}

.participation-space .scrapbook-slot > .letter,
.participation-space .scrapbook-slot > .contact-block {
  grid-column: auto;
  margin-top: 0;
  width: 100%;
}

/* Expansion is controlled by the shared coordinator */

.participation-space .scrapbook-slot.is-expanded {
  z-index: 10;
}

.participation-space .scrapbook-slot.is-expanded > .letter,
.participation-space .scrapbook-slot.is-expanded > .contact-block {
  width: var(--artifact-expanded-width, 135%);
}

.participation-space
.scrapbook-slot[data-expand-direction="left"].is-expanded
> .contact-block {
  transform: translateX(
    calc(100% - var(--artifact-expanded-width, 135%))
  );
}

/* Mobile layout */

@media (max-width: 700px) {
  .participation-space.open > .scrapbook-slot {
    grid-column: 1;
    margin-top: 0;
  }

  .participation-space .scrapbook-slot.is-expanded > .letter,
  .participation-space .scrapbook-slot.is-expanded > .contact-block {
    width: 100%;
    transform: none;
  }
}
  </style>
  <link rel="stylesheet" href="components/brand.css">
  <link rel="stylesheet" href="components/scrapbook.css">
<link rel="stylesheet" href="artifacts/welcome-letter/element.css">
<link rel="stylesheet" href="artifacts/contact/element.css">
  <link rel="stylesheet" href="field-guide.css">
</head>
<body>
  <button
    class="orientation-mark"
    type="button"
    aria-label="Open GFnU Field Guide"
    title="Open Field Guide"
  >
    <img
      src="assets/logo/gfnu-logo-white.png"
      alt=""
    >
  </button>

  <div class="cosmos" aria-hidden="true"></div>
<button class="im-here">
  I'm here
</button>
<section class="participation-space scrapbook">

  <div
    class="scrapbook-slot"
    data-artifact="welcome-letter"
    data-expand-direction="right"
    style="
      --artifact-column: 1 / span 6;
      --artifact-expanded-width: 135%;
    "
  ></div>

  <div
    class="scrapbook-slot"
    data-artifact="contact"
    data-expand-direction="left"
    style="
      --artifact-column: 8 / span 4;
      --artifact-offset-y: 90px;
      --artifact-expanded-width: calc(150% + 32px);
    "
  ></div>
</section>
  <p class="out-of-reach">
  If you are out of reach, please reload.
</p>
  <script src="components/artifact-coordinator.js"></script>
<script src="components/artifact-loader.js"></script>
  <script>
 const cosmos = document.querySelector(".cosmos");
 const imHere = document.querySelector(".im-here");
const participationSpace =
  document.querySelector(".participation-space");

imHere.addEventListener("click", () => {
  participationSpace.classList.add("open");

  const letter = participationSpace.querySelector(".letter");
  if (letter) letter.classList.add("open");

  document.querySelector(".out-of-reach").style.display = "none";
});
 const star = document.createElement("span");
 star.className = "star";
      const size = Math.random() * 3 + 2;
  star.style.width=size+"px";
  star.style.height=size+"px";
 const starX = Math.random() * 100;
 const starY = Math.random() * 100;
  star.style.left = starX + "%";
  star.style.top = starY + "%";
    imHere.style.left = starX + "%";
    imHere.style.top = starY + "%";
  star.style.opacity=Math.random()*.65+.15;
  cosmos.appendChild(star);
 const outOfReach = document.querySelector(".out-of-reach");
    if (starX < 10 || starX > 90 || starY < 10 || starY > 90) {
  setTimeout(() => {
    outOfReach.style.opacity = 1;
  }, 7000);
}
const root = document.documentElement;
let tx = 50;
let ty = 45;
let x = 50;
let y = 45;
addEventListener("pointermove", e => {
  tx = e.clientX / innerWidth * 100;
  ty = e.clientY / innerHeight * 100;
});
function breathe() {
  x += (tx - x) * .025;
  y += (ty - y) * .025;
  root.style.setProperty("--x", x + "%");
  root.style.setProperty("--y", y + "%");
  requestAnimationFrame(breathe);
}
breathe();
  document.addEventListener("artifacts:ready", (event) => {
  const space = document.querySelector(".participation-space");
  const coordinator = createArtifactCoordinator(space);

  space.querySelectorAll(".scrapbook-slot").forEach((slot) => {
    if (slot.firstElementChild) {
      coordinator.register(slot);
    }
  });

  // If the visitor entered before loading finished,
  // reveal the Welcome Letter when it arrives.
  if (space.classList.contains("open")) {
    const letter = space.querySelector(".letter");
    if (letter) letter.classList.add("open");
  }

  if (event.detail.loaded !== event.detail.total) {
    console.warn("Some artifacts could not be loaded.");
  }
});
  </script>
  <script src="field-guide.js"></script>
</body>
</html>
