<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05060a">
<title>Acquire Goods — Good for Nothing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&family=Source+Sans+3:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--x:50%;--y:45%;--orb-color:#695d9a;--ink:#f4f1e8;--muted:rgba(244,241,232,.62);--sky:#8FB8C7;--teal:#4F8F8A;--lichen:#84966B;--terra:#B66F52;--salt:#D0A19A;--display:"EB Garamond",serif;--body:"Source Sans 3",sans-serif;--ui:"Inter",sans-serif;--mono:"IBM Plex Mono",monospace}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#05060a;color:var(--ink);font-family:var(--body)}
button,a{ -webkit-tap-highlight-color:transparent }
button:focus-visible,a:focus-visible{outline:2px solid var(--sky);outline-offset:5px}
.cosmos{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(circle at 84% 18%,rgba(169,122,93,.07),transparent 28%),linear-gradient(160deg,#090b12,#05060a 48%,#080810)}
.page-glow{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at var(--x) var(--y),color-mix(in srgb,var(--orb-color) 20%,transparent),rgba(49,64,109,.09) 20%,transparent 46%);transition:opacity .5s ease}
body.modal-open .page-glow{opacity:0}
.background-star{position:absolute;border-radius:50%;background:#fff;pointer-events:none}
main{z-index:2;min-height:100svh;padding:12vh 24px 10vh;position:relative}
.introduction{max-width:720px;margin:0 auto;text-align:center}
.eyebrow{font:400 .7rem var(--mono);letter-spacing:.14em;color:var(--muted)}
h1{font:400 clamp(3.6rem,8vw,7rem)/1 var(--display);letter-spacing:-.05em;margin:24px 0}
.introduction p{max-width:460px;margin:0 auto;color:var(--muted);font-size:1.1rem;line-height:1.6}
.field{width:min(1150px,100%);height:clamp(410px,57vh,650px);position:relative;margin:3vh auto 0}
.galaxy{position:absolute;width:clamp(140px,21vw,260px);height:clamp(135px,19vw,230px);transform:translate(-50%,-50%);border:0;background:none;color:var(--ink);cursor:pointer;padding:0;isolation:isolate}
.galaxy{animation:galaxy-drift 16s ease-in-out infinite}
.galaxy.books{animation-duration:21s;animation-delay:-7s}
.galaxy.uniform{animation-duration:19s;animation-delay:-12s}
@keyframes galaxy-drift{0%,100%{translate:0 0}50%{translate:5px -9px}}
.galaxy .cloud{animation:galaxy-breathe 11s ease-in-out infinite}
.galaxy .cloud.secondary{animation-duration:15s;animation-delay:-6s}
@keyframes galaxy-breathe{0%,100%{filter:blur(18px) brightness(.85)}50%{filter:blur(23px) brightness(1.3)}}
.galaxy .cloud{position:absolute;inset:0;filter:blur(18px);opacity:.55;transition:opacity .7s ease,transform .7s ease;transform:scale(.88);border-radius:50%;background:radial-gradient(ellipse at 52% 49%,var(--cloud),transparent 63%);mix-blend-mode:screen}
.galaxy .cloud.secondary{filter:blur(27px);opacity:.24;transform:rotate(-28deg) scale(.9,.55);background:radial-gradient(ellipse,var(--accent),transparent 70%)}
.galaxy .stars{position:absolute;inset:0;transition:transform 1.5s ease,filter 3s ease}
.galaxy .point{position:absolute;border-radius:50%;background:var(--ink);pointer-events:none}
.galaxy .galaxy-name{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);white-space:nowrap;font:400 .71rem var(--mono);letter-spacing:.15em;color:rgba(244,241,232,.78);text-shadow:0 2px 10px #05060a;transition:color .4s ease,letter-spacing .4s ease}
.galaxy .state{position:absolute;left:50%;bottom:-32px;transform:translateX(-50%);white-space:nowrap;font:400 .57rem var(--mono);letter-spacing:.1em;color:rgba(244,241,232,.36)}
.galaxy:not(:disabled):hover .cloud,.galaxy:not(:disabled):focus-visible .cloud{opacity:.55;transform:scale(.88)}
.galaxy:not(:disabled):hover .stars,.galaxy:not(:disabled):focus-visible .stars{transform:none;filter:brightness(1.75)}
.galaxy:not(:disabled):hover .point,.galaxy:not(:disabled):focus-visible .point{opacity:1!important;box-shadow:0 0 2px rgba(244,241,232,.2)}
.galaxy:not(:disabled):hover .galaxy-name,.galaxy:not(:disabled):focus-visible .galaxy-name{color:#fff;letter-spacing:.2em}
.galaxy:disabled{cursor:default;opacity:.55}
.galaxy:disabled .cloud{opacity:.32}
.galaxy.games{left:15%;top:36%;--cloud:rgba(79,143,138,.55);--accent:rgba(143,184,199,.6)}
.galaxy.books{left:83%;top:33%;--cloud:rgba(208,161,154,.48);--accent:rgba(182,111,82,.55)}
.galaxy.uniform{left:51%;top:73%;--cloud:rgba(132,150,107,.45);--accent:rgba(143,184,199,.35)}
.field-hint{padding-top:70px;font:400 .65rem var(--mono);letter-spacing:.09em;color:rgba(244,241,232,.38);text-align:center;margin:0}
.overlay[hidden]{display:none}
.overlay{position:fixed;inset:0;z-index:20;overflow-y:auto;overscroll-behavior:contain;background:rgba(5,6,10,.83);padding:clamp(10px,3vw,34px);animation:arrive .42s ease both}
@keyframes arrive{from{opacity:0}to{opacity:1}}
.paper {
  position: relative;
  isolation: isolate;
  width: min(1080px, 100%);
  min-height: calc(100svh - 68px);
  margin: auto;
  color: var(--ink);
  background: transparent;
  padding: clamp(26px, 6vw, 76px);
  box-shadow: none;
}
.paper:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.18;pointer-events:none;background-image:repeating-linear-gradient(0deg,rgba(91,68,47,.035) 0px,rgba(91,68,47,.035) 1px,transparent 1px,transparent 4px),repeating-linear-gradient(90deg,rgba(91,68,47,.025) 0px,rgba(91,68,47,.025) 1px,transparent 1px,transparent 6px)}
.paper:after{content:"";position:absolute;right:-10px;top:185px;width:100px;height:100px;border-radius:50%;background:rgba(182,111,82,.13);z-index:-1}
  .paper::before,
.paper::after {
  display: none;
}
  .paper-header {
  display: flex;
  justify-content: flex-end;
  align-items: flex-start;
  gap: 18px;
}
.paper .eyebrow{color:#746c60}
.paper h2{font:400 clamp(3.6rem,7vw,6.4rem)/1 var(--display);letter-spacing:-.04em;margin:22px 0 22px}
.close {
  width: 42px;
  height: 42px;
  margin-left: auto;
  border: 1px solid rgba(37, 34, 31, .28);
  background: transparent;
  color: #25221f;
  font-size: 26px;
  cursor: pointer;
  flex-shrink: 0;
  transition: background .25s;
}
.close:hover{background:rgba(37,34,31,.07)}
.paper-intro{max-width:620px;font-size:1.15rem;line-height:1.65;margin:0 0 62px}
.paper-rule{height:1px;background:rgba(37,34,31,.22);margin-bottom:30px}
.catalogue-label{font:.69rem var(--mono);letter-spacing:.12em;color:#746c60;margin-bottom:20px}
   .paper .eyebrow,
.catalogue-label {
  color: rgba(244, 241, 232, .62);
}

.paper-intro {
  color: var(--ink);
}

.paper-rule {
  background: rgba(244, 241, 232, .22);
}

.close {
  color: var(--ink);
  border-color: rgba(244, 241, 232, .28);
  border-radius: 12px;
}

.close:hover {
  background: rgba(244, 241, 232, .08);
}
.entry{display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,1fr);gap:clamp(20px,4vw,46px);padding:26px 0 50px;border-bottom:1px solid rgba(37,34,31,.23)}
  .entry {
  background: #eee8dc;
  color: #25221f;
  border-radius: 12px;
  padding: 28px;
  border: 1px solid rgba(37, 34, 31, .15);
}
.preview{min-height:260px;background:#080b13;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.preview:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,rgba(5,6,10,.18),transparent 35%)}
.preview img{display:block;width:100%;height:100%;min-height:260px;object-fit:cover;object-position:center}
.entry-number{font:.67rem var(--mono);letter-spacing:.1em;color:#746c60}
.entry h3{font:400 clamp(2.2rem,3.5vw,3.1rem)/1.05 var(--display);margin:16px 0 8px}
.subtitle{font-style:italic;font-family:var(--display);font-size:1.28rem;margin:0 0 20px}
.entry-copy{font-size:1.04rem;line-height:1.62;max-width:390px;margin:0 0 24px}
.status{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 24px}
.status span{font:.65rem var(--mono);letter-spacing:.07em;padding:7px 9px;border:1px solid rgba(37,34,31,.35)}
.launch{display:inline-block;color:#25221f;text-decoration:none;border-bottom:1px solid #25221f;padding:0 0 5px;font:500 .89rem var(--ui)}
.launch:hover{color:#4F8F8A;border-color:#4F8F8A}
.future {
  margin-top: 44px;
  color: var(--muted);
  font-size: .95rem;
  line-height: 1.5;
}
body.modal-open{overflow:hidden}
@media(max-width:700px){main{padding-top:13vh}.field{height:490px}.galaxy.games{left:23%;top:28%}.galaxy.books{left:78%;top:38%}.galaxy.uniform{left:48%;top:76%}.galaxy{width:155px;height:155px}.entry{grid-template-columns:1fr}.preview{min-height:210px}.paper-intro{margin-bottom:36px}.paper{min-height:calc(100svh - 20px)}.overlay{padding:10px}}
@media(prefers-reduced-motion:reduce){.galaxy,.galaxy .cloud{animation:none!important}.page-glow{display:none}*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
  <link rel="stylesheet" href="components/brand.css">
  <link rel="stylesheet" href="components/scrapbook.css">
  <link rel="stylesheet" href="artifacts/spiral-engine/element.css">
<link rel="stylesheet" href="field-guide.css">
</head>
<body data-guide-page="goods">
<div class="cosmos" id="cosmos" aria-hidden="true"></div><div class="page-glow" aria-hidden="true"></div>
<main>
<header class="introduction"><div class="eyebrow">GFNU / WEST</div><h1>Acquire Goods</h1><p>Things to encounter, take away, put to work,<br>or pass along.</p></header>
<div class="field" aria-label="Goods collections">
<button type="button" class="galaxy games" data-galaxy="games" aria-haspopup="dialog" aria-label="Explore Games">
<span class="cloud"></span><span class="cloud secondary"></span><span class="stars" aria-hidden="true"></span><span class="galaxy-name">GAMES</span></button>
<button type="button" class="galaxy books" disabled aria-label="Books, coming soon">
<span class="cloud"></span><span class="cloud secondary"></span><span class="stars" aria-hidden="true"></span><span class="galaxy-name">BOOKS</span><span class="state">COMING SOON</span></button>
<button type="button" class="galaxy uniform" disabled aria-label="Uniform, coming soon">
<span class="cloud"></span><span class="cloud secondary"></span><span class="stars" aria-hidden="true"></span><span class="galaxy-name">UNIFORM</span><span class="state">COMING SOON</span></button>
</div><p class="field-hint">SELECT A WORLD TO EXPLORE</p>
</main>
<div class="overlay" id="catalogue" role="dialog" aria-modal="true" aria-label="Games" tabindex="-1" hidden>
<section class="paper">


<div class="games-space scrapbook">

  <div
    class="scrapbook-slot"
    data-artifact="spiral-engine"
    data-expand-direction="right"
    style="
      --artifact-column: 2 / span 10;
      --artifact-expanded-width: 115%;
    "
  ></div>

</div> 
</section> 
</div> 
<script>
(function(){
let seed=93471;
function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const root=document.documentElement;
const colors=['#8FB8C7','#4F8F8A','#84966B','#B66F52','#D0A19A'];
const orbColor=colors[Math.floor(Math.random()*colors.length)];
root.style.setProperty('--orb-color',orbColor);
if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
let tx=50,ty=45,x=50,y=45;
window.addEventListener('pointermove',e=>{tx=e.clientX/window.innerWidth*100;ty=e.clientY/window.innerHeight*100},{passive:true});
function breathe(){x+=(tx-x)*.025;y+=(ty-y)*.025;root.style.setProperty('--x',x+'%');root.style.setProperty('--y',y+'%');requestAnimationFrame(breathe)}
requestAnimationFrame(breathe);
}
const cosmos=document.getElementById('cosmos');
for(let i=0;i<140;i++){const s=document.createElement('span');s.className='background-star';const size=Math.random()<.9?Math.random()*1.2+.3:Math.random()*1.8+1.2;s.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;opacity:${Math.random()*.65+.15}`;cosmos.appendChild(s)}
document.querySelectorAll('.galaxy').forEach((g,gi)=>{
const container=g.querySelector('.stars');const n=gi===0?180:140;
for(let i=0;i<n;i++){const a=rnd()*Math.PI*2;const r=Math.sqrt(-2*Math.log(Math.max(.00001,1-rnd())));const x=50+Math.cos(a)*r*15;const y=50+Math.sin(a)*r*10+(x-50)*.18;if(x<2||x>98||y<3||y>97)continue;
const s=document.createElement('span');s.className='point';const size=rnd()<.94?.45+rnd()*1.15:1.8+rnd()*1.5;s.style.cssText=`left:${x}%;top:${y}%;width:${size}px;height:${size}px;opacity:${.12+rnd()*.72};box-shadow:0 0 ${rnd()*7}px rgba(244,241,232,.4)`;container.appendChild(s)}
});
const modal = document.getElementById('catalogue');
let trigger = null;

function open(g) {
  trigger = g;
  modal.hidden = false;
  document.body.classList.add('modal-open');
  modal.scrollTop = 0;
  modal.focus();
}

function shut() {
  modal.hidden = true;
  document.body.classList.remove('modal-open');
  if (trigger) trigger.focus();
}

document.querySelector('[data-galaxy="games"]')
  .addEventListener('click', e => open(e.currentTarget));

modal.addEventListener('click', e => {
  if (
    e.target.closest('.game-artifact') ||
    e.target.closest('[data-artifact-close]')
  ) {
    return;
  }

  shut();
});
document.addEventListener('keydown',e=>{if(modal.hidden)return;if(e.key==='Escape')shut();if(e.key==='Tab'){const items=[...modal.querySelectorAll('button:not([disabled]),a[href]')];const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
})();
</script>
 <script src="components/artifact-coordinator.js"></script>
<script src="components/artifact-loader.js"></script>

<script>
document.addEventListener('artifacts:ready', () => {
  const space = document.querySelector('.games-space');
  if (!space) return;

  const coordinator = createArtifactCoordinator(space);

  space.querySelectorAll('.scrapbook-slot').forEach(slot => {
    coordinator.register(slot);
  });
});
</script>

<script src="field-guide.js">
  
</script>
</body></html>
