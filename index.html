<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05060a">
<title>Good for Nothing</title>
<style>
:root{--x:50%;--y:45%;--ink:#f4f1e8;--muted:rgba(244,241,232,.62)}
*{box-sizing:border-box}
body{margin:0;background:#05060a;color:var(--ink);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
.cosmos{position:fixed;inset:0;z-index:-2;overflow:hidden;background:radial-gradient(circle at var(--x) var(--y),rgba(105,93,154,.20),rgba(49,64,109,.09) 20%,transparent 46%),radial-gradient(circle at 84% 18%,rgba(169,122,93,.07),transparent 28%),linear-gradient(160deg,#090b12,#05060a 48%,#080810)}
.cosmos:before,.cosmos:after{content:"";position:absolute;inset:-20%;background-repeat:repeat;pointer-events:none}
.cosmos:before{opacity:.68;background-image:radial-gradient(circle,rgba(255,255,255,.85) 0 1px,transparent 1.3px),radial-gradient(circle,rgba(255,255,255,.5) 0 .7px,transparent 1px);background-size:137px 137px,83px 83px;background-position:13px 27px,49px 11px;animation:drift 70s linear infinite}
.cosmos:after{opacity:.28;background-image:radial-gradient(circle,rgba(255,255,255,.95) 0 1px,transparent 1.4px);background-size:211px 211px;background-position:91px 63px;animation:drift 110s linear infinite reverse}
@keyframes drift{to{transform:translate3d(3%,2%,0)}}
main{min-height:100svh;width:min(1180px,calc(100% - 48px));margin:auto;display:flex;flex-direction:column;justify-content:center;padding:8vh 0}
h1{max-width:1080px;margin:0;font-size:clamp(3.5rem,8.5vw,8.6rem);line-height:.91;letter-spacing:-.065em;font-weight:400;text-wrap:balance}
p{margin:56px 0 0 auto;width:min(520px,100%);color:var(--muted);font-size:clamp(1rem,1.5vw,1.25rem);line-height:1.5}
@media(max-width:700px){main{width:calc(100% - 32px)}h1{font-size:clamp(3.1rem,15vw,5.4rem);line-height:.93}p{margin:42px 0 0}}
@media(prefers-reduced-motion:reduce){.cosmos:before,.cosmos:after{animation:none}}
</style>
</head>
<body>
<div class="cosmos" aria-hidden="true"></div>
<main>
<h1>Creating conditions where something good is the most likely outcome.</h1>
<p>The Good for Nothing Universe is at your service.</p>
</main>
<script>
const root=document.documentElement;let tx=50,ty=45,x=50,y=45;
addEventListener("pointermove",e=>{tx=e.clientX/innerWidth*100;ty=e.clientY/innerHeight*100},{passive:true});
function breathe(){x+=(tx-x)*.025;y+=(ty-y)*.025;root.style.setProperty("--x",x+"%");root.style.setProperty("--y",y+"%");requestAnimationFrame(breathe)}
if(!matchMedia("(prefers-reduced-motion: reduce)").matches)breathe();
</script>
</body>
</html>
