<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05060a">
<title>Good for Nothing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&family=Source+Sans+3:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --x:50%;
  --y:45%;
  --ink:#f4f1e8;
  --muted:rgba(244,241,232,.62);
  --font-display: "EB Garamond", serif;
  --font-body: "Source Sans 3", sans-serif;
  --font-ui: "Inter", sans-serif;
  --font-correspondence: "IBM Plex Mono", monospace;
  --radius:12px;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:#05060a;
  color:var(--ink);
  font-family:var(--font-body);
}
.cosmos{position:fixed;inset:0;z-index:-2;overflow:hidden;background:radial-gradient(circle at var(--x) var(--y),rgba(105,93,154,.20),rgba(49,64,109,.09) 20%,transparent 46%),radial-gradient(circle at 84% 18%,rgba(169,122,93,.07),transparent 28%),linear-gradient(160deg,#090b12,#05060a 48%,#080810)}
.star{
  position:absolute;
  border-radius:50%;
  background:white;
  pointer-events:none;
}
main{
  min-height:100svh;
  width:min(1180px,calc(100% - 48px));
  margin:auto;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:8vh 0
}
.ground {
  min-height: 100svh;
  background: var(--ink);
  color: #05060a;
  padding: 12vh max(24px, calc((100% - 1180px) / 2));
}
.ground h2 {
  margin: 0;
  max-width: 760px;
  font-family: var(--font-display);
  font-size: clamp(2.8rem, 5vw, 5.4rem);
  font-weight: 400;
  line-height: .98;
  letter-spacing: -.035em;
  text-wrap: balance;
}
.logo{
  width:120px;
  height:auto;
  margin-bottom:48px;
  align-self:flex-end;
  opacity: .62;
  transition:opacity 1.5s ease; 
  animation: float 12s ease-in-out infinite;
  }
   .logo:hover {
    opacity: 1;
  }
@keyframes float {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-8px);
  }
}
.participate {
  align-self: flex-end;
   color: var(--muted);
   margin-top: 80px;
   font-family:var(--font-ui);
   text-decoration: none;
   transition: color 1.5s ease;
}
  .participate:hover {
    color: var(--ink);
  }
h1{
  max-width:1080px;
  margin:-40px 0 0;
  font-family:var(--font-display);
  font-size:clamp(3.5rem,8.5vw,8.6rem);
  line-height:.91;
  letter-spacing:-.065em;
  font-weight:400;
  text-wrap:balance
}
p{margin:56px 0 0 0;width:min(520px,100%);color:var(--muted);font-size:clamp(1rem,1.5vw,1.25rem);line-height:1.5}
@media(max-width:700px){main{width:calc(100% - 32px)}h1{font-size:clamp(3.1rem,15vw,5.4rem);line-height:.93}p{margin:42px 0 0}}
</style>
</head>
<body>
<div class="cosmos" aria-hidden="true"></div>
<main>
<img class="logo" 
  src="assets/logo/gfnu-logo-white.png" 
  alt="Good for Nothing Universe"
  >
<h1>Creating conditions where something good is the most likely outcome.</h1>
<p>The Good for Nothing Universe is at your service.</p>
<a 
  class="participate" 
  href="participate.html"
>
  Participate →
</a>
</main>
  <section class="ground">
  <h2>The Good for Nothing Universe begins with very little.</h2>
</section>
<script>
const root=document.documentElement;let tx=50,ty=45,x=50,y=45;
addEventListener("pointermove",e=>{tx=e.clientX/innerWidth*100;ty=e.clientY/innerHeight*100},{passive:true});
function breathe(){x+=(tx-x)*.025;y+=(ty-y)*.025;root.style.setProperty("--x",x+"%");root.style.setProperty("--y",y+"%");requestAnimationFrame(breathe)}
if(!matchMedia("(prefers-reduced-motion: reduce)").matches)breathe();
const cosmos=document.querySelector(".cosmos");
for(let i=0;i<140;i++){
  const star=document.createElement("span");
  star.className="star";
  const size=Math.random() < .9
    ? Math.random() * 1.2 + .3
    : Math.random() * 1.8 + 1.2;
  star.style.width=size+"px";
  star.style.height=size+"px";
  star.style.left=Math.random()*100+"%";
  star.style.top=Math.random()*100+"%";
  star.style.opacity=Math.random()*.65+.15;
  cosmos.appendChild(star);
}
</script>
</body>
</html>
